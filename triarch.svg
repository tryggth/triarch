<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="1"/>
    </radialGradient>

    <!-- Edge Gradients -->
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)"/>
  <rect width="496" height="496" x="2" y="2" rx="38" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Outer Cyclic Energy Ring -->
  <circle cx="250" cy="245" r="190" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 12" stroke-opacity="0.3"/>

  <!-- PENROSE TRI-DIE GEOMETRY -->
  <g transform="translate(0, -10)" filter="url(#neonGlow)">
    
    <!-- Arm A (Ruby / Die A - Top Right to Bottom) -->
    <polygon points="250,70 390,310 330,310 250,170 170,310 200,360 390,360 430,310 250,0" 
             fill="url(#gradA)" opacity="0.95" />
    
    <!-- Arm B (Cyan / Die B - Bottom to Left) -->
    <polygon points="430,310 390,360 110,360 70,310 210,70 250,70 150,240 330,240 370,310" 
             fill="url(#gradB)" opacity="0.95" />

    <!-- Arm C (Amber / Die C - Left to Top) -->
    <polygon points="110,360 70,310 250,0 290,70 150,310 290,310 330,240 210,240 170,310" 
             fill="url(#gradC)" opacity="0.95" />

  </g>

  <!-- DICE PIP ACCENTS -->
  <!-- Die A Pips (Top Right) -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="310" cy="180" r="4.5"/>
    <circle cx="325" cy="195" r="4.5"/>
    <circle cx="340" cy="210" r="4.5"/>
  </g>

  <!-- Die B Pips (Bottom Center) -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="235" cy="335" r="4.5"/>
    <circle cx="265" cy="335" r="4.5"/>
  </g>

  <!-- Die C Pips (Top Left) -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="170" cy="200" r="4.5"/>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="250" y="425" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="28" font-weight="900" letter-spacing="8" fill="#f8fafc">
    TRIARCH
  </text>
  <text x="250" y="450" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="4" fill="#a78bfa">
    CYCLIC EDGE
  </text>
</svg>
